[platformio]
default_envs = matrix-all-on
src_dir = demo/matrix_all_on
build_dir = .pio/build-matrix-demo

[env:matrix-all-on]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = partitions.csv
build_flags = -Wall -Wextra
